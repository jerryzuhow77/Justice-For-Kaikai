name: Apply cinematic layout hotfix

on:
  push:
    branches:
      - feat/cinematic-revamp-20260822

permissions:
  contents: write

jobs:
  patch-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/cinematic-revamp-20260822
          fetch-depth: 0

      - name: Append responsive visual hotfix once
        shell: bash
        run: |
          set -euo pipefail
          marker='CINEMATIC-RESPONSIVE-HOTFIX-20260822'
          if grep -q "$marker" assets/css/cinematic-revamp.css; then
            echo "Hotfix is already present."
            exit 0
          fi

          cat >> assets/css/cinematic-revamp.css <<'CSS'

          /* CINEMATIC-RESPONSIVE-HOTFIX-20260822
           * Final visual QA: reserve desktop subtitle space, keep GSAP static
           * states visible, provide Linux CJK fallbacks, and compact the
           * mobile 113 safety shortcut so it no longer masks the page.
           */
          :root {
            --serif: "Iowan Old Style", "Noto Serif TC", "Noto Serif CJK TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
            --sans: Inter, "Noto Sans TC", "Noto Sans CJK TC", "Source Han Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
          }

          .cinema-bg,
          .cinema-rain,
          .cinema-mist,
          .cinema-papers,
          .cinema-door {
            visibility: visible !important;
          }

          @media (min-width: 761px) {
            .cinema-visual {
              height: clamp(340px, calc(100dvh - 480px), 680px);
              min-height: 340px;
              aspect-ratio: auto;
            }
          }

          @media (max-height: 760px) and (min-width: 761px) {
            .cinema-shell { padding-top: .55rem; }
            .cinema-header { margin-bottom: .35rem; }
            .cinema-header h2 { font-size: clamp(1.65rem, 3.2vw, 2.6rem); }
            .cinema-header > div > p:not(.cinema-type) { font-size: .75rem; }
            .source-ribbon { margin-bottom: .35rem; padding: .4rem .65rem; }
            .cinema-visual {
              height: clamp(280px, calc(100dvh - 410px), 380px);
              min-height: 280px;
            }
            .dialogue-box {
              min-height: 104px;
              padding: .75rem 3.2rem .8rem 1rem;
            }
            .dialogue-box p { font-size: .95rem; line-height: 1.58; }
          }

          @media (max-width: 760px) {
            .help-fab {
              left: auto;
              right: .65rem;
              width: auto;
              min-width: 0;
              max-width: 170px;
              padding: .45rem .72rem;
              grid-template-columns: auto auto;
              justify-content: center;
            }
            .help-fab strong { font-size: 1.05rem; }
            .help-fab span { font-size: .64rem; white-space: nowrap; }
          }
          CSS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/css/cinematic-revamp.css
          git commit -m "fix: refine cinematic viewport and mobile safety UI"
          git push origin HEAD:feat/cinematic-revamp-20260822
