name: Apply dialogue-driven game revamp to feature branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-dialogue-game-revamp-main.yml

permissions:
  contents: write

jobs:
  apply-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch with payload chunks
        uses: actions/checkout@v4
        with:
          ref: feat/dialogue-game-animation-video-20260822
          fetch-depth: 0

      - name: Reassemble, verify, and apply tested website payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/dialogue-game-payload/chunk-* > /tmp/dialogue-game-revamp.b64
          test "$(wc -c < /tmp/dialogue-game-revamp.b64)" -eq 51052
          base64 -d /tmp/dialogue-game-revamp.b64 > /tmp/dialogue-game-revamp.tar.xz
          echo 'f23b74e2ec11376147a74d6899b332c3cacafd68852a928b0752042f371d12b0  /tmp/dialogue-game-revamp.tar.xz' | sha256sum -c -
          tar -xJf /tmp/dialogue-game-revamp.tar.xz -C .

          node --check assets/js/cinematic-revamp.js
          node --check assets/js/cinematic-revamp-core.js
          grep -q 'id="game-world"' index.html
          grep -q 'transcript-fold-top' index.html
          grep -q 'dialogueGamePlan' assets/js/cinematic-revamp-core.js
          grep -q 'publicDialogueText' assets/js/cinematic-revamp-core.js
          grep -q 'maleCompensation = scene.type === "shadow" ? 1.085 : 1' assets/js/cinematic-revamp-core.js
          grep -q 'body.capture-mode .cinema-play-overlay' assets/css/cinematic-revamp.css
          grep -q 'GAME LOCATION' assets/css/cinematic-revamp.css

          if grep -Eq '母稿原句|本專題筆記整理|來函情境重構' index.html; then
            echo 'Public index still contains internal reference-copy wording.'
            exit 1
          fi

      - name: Commit dialogue-driven game website to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets/css/cinematic-revamp.css assets/css/cinematic-revamp-core.css assets/js/cinematic-revamp.js assets/js/cinematic-revamp-core.js
          git rm -r -- .github/dialogue-game-payload
          git rm -f -- .github/dialogue-game-revamp-payload.b64 .github/dialogue-game-trigger.txt .github/workflows/apply-dialogue-game-revamp.yml
          git commit -m 'feat: rebuild animations as dialogue-driven game scenes'
          git push origin HEAD:feat/dialogue-game-animation-video-20260822

      - name: Remove one-time workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/apply-dialogue-game-revamp-main.yml
          git commit -m 'chore: remove one-time dialogue game revamp workflow'
          git push origin HEAD:main
