name: One-off PR28 live production E2E

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-pr28-live-e2e.yml"
      - "tests/oneoff-pr28-live-e2e.mjs"

permissions:
  contents: read

concurrency:
  group: oneoff-pr28-live-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-production-e2e:
    name: Desktop and mobile production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://jerryzuhow77.github.io/Justice-For-Kaikai/
      EXPECTED_PRODUCTION_SHA: 5d3b7eba719ea743ab84b0082a25154778a8b96e
      ARTIFACT_DIR: artifacts
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright without changing repository manifests
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run live-site desktop and mobile E2E
        run: node tests/oneoff-pr28-live-e2e.mjs

      - name: Upload screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr28-live-production-e2e-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
