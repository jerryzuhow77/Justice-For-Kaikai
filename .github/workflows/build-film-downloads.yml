name: Record complete film downloads

on:
  push:
    branches:
      - codex/full-film-recordings
    paths:
      - .github/workflows/build-film-downloads.yml
      - scripts/record-film-downloads.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recording branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install recorder
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Record all four complete films
        run: node scripts/record-film-downloads.mjs

      - name: Verify MP4 tracks, dimensions, durations and QA
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local file="$1"
            local expected="$2"
            test -s "$file"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$file")" = "h264"
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$file")" = "aac"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$file")" = "960"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$file")" = "540"
            duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$file")"
            awk -v actual="$duration" -v expected="$expected" 'BEGIN { exit !((actual >= expected - 0.2) && (actual <= expected + 0.2)) }'
          }
          verify assets/video/fm-a-buried-qing-legend.mp4 155
          verify assets/video/fm-d-unarrived-visit.mp4 144
          verify assets/video/fm-b-hair-turns-white.mp4 105
          verify assets/video/fm-c-two-eras-one-door.mp4 195
          node scripts/qa.mjs

      - name: Commit complete recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video
          if git diff --cached --quiet; then
            echo "Recordings already match."
          else
            git commit -m "以完整五幕錄影取代推鏡版 MP4"
            git push origin HEAD:${{ github.ref_name }}
          fi
