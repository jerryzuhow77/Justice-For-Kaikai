name: Apply final cinematic polish

on:
  push:
    branches:
      - fix/cinematic-final-polish-20260822

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out polish branch
        uses: actions/checkout@v4
        with:
          ref: fix/cinematic-final-polish-20260822
          fetch-depth: 0

      - name: Patch mobile safety UI and compact player
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('assets/js/cinematic-revamp.js')
          js = js_path.read_text(encoding='utf-8')

          old_progress = '''  function updateReadingProgress() {
            readingProgressFrame = 0;
            const available = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
            const ratio = clamp(window.scrollY / available, 0, 1);
            const bar = $("#reading-progress-bar");
            if (bar) bar.style.width = `${ratio * 100}%`;
          }
          '''
          new_progress = '''  function updateReadingProgress() {
            readingProgressFrame = 0;
            const available = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
            const ratio = clamp(window.scrollY / available, 0, 1);
            const bar = $("#reading-progress-bar");
            if (bar) bar.style.width = `${ratio * 100}%`;

            // Keep the mobile emergency shortcut out of the opening composition.
            // It fades in only after the reader has moved beyond the first screen.
            const isMobile = window.matchMedia("(max-width: 760px)").matches;
            const helpThreshold = Math.max(360, window.innerHeight * .72);
            document.body.classList.toggle("show-help-fab", !isMobile || window.scrollY > helpThreshold);
          }
          '''
          if old_progress not in js:
              raise SystemExit('updateReadingProgress anchor not found')
          js = js.replace(old_progress, new_progress, 1)

          old_resize = '''    $$("a", nav).forEach((link) => link.addEventListener("click", () => setNavOpen(false))); window.addEventListener("resize", () => { if (window.innerWidth > 1120) setNavOpen(false); });
          '''
          new_resize = '''    $$("a", nav).forEach((link) => link.addEventListener("click", () => setNavOpen(false))); window.addEventListener("resize", () => { if (window.innerWidth > 1120) setNavOpen(false); updateReadingProgress(); });
          '''
          if old_resize not in js:
              raise SystemExit('resize listener anchor not found')
          js = js.replace(old_resize, new_resize, 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/css/cinematic-revamp.css')
          css = css_path.read_text(encoding='utf-8')
          marker = 'CINEMATIC-FINAL-POLISH-20260822'
          if marker not in css:
              css += r'''

          /* CINEMATIC-FINAL-POLISH-20260822
           * Final handheld QA: delay the floating 113 shortcut until the
           * reader leaves the opening screen, balance long act titles, and
           * reduce the height of the fixed mobile transport controls.
           */
          @media (max-width: 760px) {
            .help-fab {
              opacity: 0;
              transform: translateY(18px) scale(.94);
              pointer-events: none;
              transition: opacity .24s ease, transform .24s ease;
            }
            body.show-help-fab .help-fab {
              opacity: 1;
              transform: none;
              pointer-events: auto;
            }

            .cinema-header {
              grid-template-columns: minmax(0, 1fr) auto;
            }
            .cinema-header > div:first-child {
              min-width: 0;
            }
            .cinema-header h2 {
              max-width: 11.5em;
              font-size: clamp(1.55rem, 7.4vw, 2.35rem);
              line-height: 1.08;
              letter-spacing: -.015em;
              text-wrap: balance;
            }
            .cinema-header-actions {
              align-self: start;
            }

            .cinema-control-dock {
              bottom: max(.35rem, env(safe-area-inset-bottom));
            }
            .timeline-control {
              grid-template-columns: minmax(0, 1fr) auto;
              gap: .45rem;
            }
            .timeline-control label {
              position: absolute;
              width: 1px;
              height: 1px;
              padding: 0;
              margin: -1px;
              overflow: hidden;
              clip: rect(0, 0, 0, 0);
              white-space: nowrap;
              border: 0;
            }
          }

          @media (max-width: 430px) {
            .cinema-header h2 {
              max-width: 10.5em;
              font-size: clamp(1.45rem, 7vw, 1.9rem);
            }
            .cinema-header > div:first-child > p:not(.cinema-type) {
              line-height: 1.45;
            }
          }
          '''
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('cinematic-revamp.css?v=20260822-1', 'cinematic-revamp.css?v=20260822-2')
          index = index.replace('cinematic-revamp.js?v=20260822-1', 'cinematic-revamp.js?v=20260822-2')
          index_path.write_text(index, encoding='utf-8')
          PY

          node --check assets/js/cinematic-revamp.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html assets/css/cinematic-revamp.css assets/js/cinematic-revamp.js
          git commit -m "fix: polish mobile cinema and emergency shortcut"
          git push origin HEAD:fix/cinematic-final-polish-20260822
