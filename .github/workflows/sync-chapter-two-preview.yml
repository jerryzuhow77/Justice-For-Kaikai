name: Synchronize Chapter Two Preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-chapter-two-preview.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize published files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace(
              "assets/css/cinematic-revamp.css?v=20260823-2",
              "assets/css/cinematic-revamp.css?v=20260823-ch2-5",
          )
          index = index.replace(
              "assets/js/cinematic-revamp.js?v=20260823-2",
              "assets/js/cinematic-revamp.js?v=20260823-ch2-5",
          )
          if '<meta name="chapter-two-preview"' not in index:
              index = index.replace(
                  '<meta name="color-scheme" content="dark">',
                  '<meta name="color-scheme" content="dark">\n  <meta name="chapter-two-preview" content="chosen-life-v4">',
                  1,
              )
          if 'href="#chapter-two-preview">第二章預告</a>' not in index:
              index = index.replace(
                  '<a href="#action">守護行動</a>',
                  '<a href="#chapter-two-preview">第二章預告</a><a href="#action">守護行動</a>',
                  1,
              )
          index_path.write_text(index, encoding="utf-8")

          story_path = Path("story.html")
          story = story_path.read_text(encoding="utf-8")
          old = '''<h4 id="進入第二章沒人要的孩子">進入第二章｜沒人要的孩子</h4>
          <p>下一章從一個在程序中被反覆提起的說法開始。</p>
          <p>一句話出現得很多次，並不因此自動成為事實；一份紀錄寫得端正，也不代表它已經包含所有人的聲音。我們將把原始文件、司法認定、機構說明、家屬記憶與編輯分析分開排列，逐一標示它們能證明什麼、不能證明什麼。</p>
          <p>第二章不替任何一方預先定罪，也不把沒有辦法回話的孩子變成戲劇工具。它要問的是：當某個說法在不同人之間被傳遞、重述、縮寫，最後進入制度判斷時，哪些語境被留下，哪些被消失？而一個尚未能為自己陳情的孩子，又如何在大人的語言裡被定義？</p>
          <nav class="chapter-actions" aria-label="章末導覽"><a href="https://jerryzuhow77.github.io/child-advocacy-site/">回到護童行動聯盟</a><a href="index.html#full-copy">回到閱讀地圖</a><a href="#source-index">查看全部來源</a><span aria-disabled="true">第二章規劃中</span></nav>'''.replace("          ", "")
          new = '''<h4 id="chapter-two-preview" class="chapter-two-story-heading">進入第二章｜沒人要的孩子</h4>
          <section class="chapter-two-story-preview" aria-labelledby="chapter-two-preview">
          <p class="chapter-two-story-kicker"><strong>孩子被選擇的人生</strong></p>
          <p class="chapter-two-story-question">如果你的人生，從來不能自己選呢？</p>
          <p>不能選擇出生在哪一個家庭，不能選擇誰來照顧自己，也不能選擇今晚睡在哪裡。</p>
          <p>當大人談的是出養、托育、媒合、訪視與處遇，孩子真正經歷的，卻是每天醒來看見誰、哭的時候誰會來、害怕的時候能不能離開。</p>
          <p>他沒有坐在決定人生的桌子旁，卻承受每一個決定帶來的結果。</p>
          <blockquote class="chapter-two-story-thesis">
          <p>對大人而言，那也許只是一次決定。<br />
          <strong>對孩子而言——那就是他的人生。</strong></p>
          </blockquote>
          <p>第二章不先從制度究責開始。我們把鏡頭降到孩子的高度，看大人如何一次次替他選擇，而一個還不能替自己決定的孩子，如何生活在那些選擇之中。</p>
          <p>這一章不把「沒人要」當成孩子的標籤。它追問的是：當所有人都能替一個孩子決定，他卻無法決定自己的人生，替他做選擇的大人，要如何確定那是一個安全的選擇？</p>
          <nav class="chapter-actions" aria-label="章末導覽"><a href="https://jerryzuhow77.github.io/child-advocacy-site/">回到護童行動聯盟</a><a href="index.html#full-copy">回到閱讀地圖</a><a href="#source-index">查看全部來源</a><span aria-disabled="true">第二章製作中</span></nav>
          </section>'''.replace("          ", "")
          if old not in story:
              raise SystemExit("Expected legacy Chapter Two preview block was not found exactly once.")
          story = story.replace(old, new, 1)
          story_path.write_text(story, encoding="utf-8")

          styles_path = Path("assets/css/styles.css")
          styles = styles_path.read_text(encoding="utf-8")
          marker = "/* CHAPTER_TWO_CHOSEN_LIFE_V4 */"
          if marker not in styles:
              styles += r'''

          /* CHAPTER_TWO_CHOSEN_LIFE_V4 */
          .story-page .chapter-two-story-heading{margin-top:4rem;padding:2rem 2rem .8rem;border:1px solid rgba(96,79,67,.2);border-bottom:0;border-radius:1.25rem 1.25rem 0 0;background:linear-gradient(150deg,#eef2ed,#f4ece6);color:#263733}
          .story-page .chapter-two-story-heading::before{content:"NEXT CHAPTER · 02";display:block;margin-bottom:.8rem;color:#8b6759;font-size:.72rem;letter-spacing:.18em}
          .story-page .chapter-two-story-preview{margin:0 0 3rem;padding:1rem 2rem 2.5rem;border:1px solid rgba(96,79,67,.2);border-top:0;border-radius:0 0 1.25rem 1.25rem;background:linear-gradient(150deg,#eef2ed,#f4ece6);color:#263733}
          .story-page .chapter-two-story-kicker{color:#8b6759;font-family:serif;font-size:1.5rem;letter-spacing:.08em}
          .story-page .chapter-two-story-question{font-family:serif;font-size:clamp(1.55rem,4vw,2.35rem);line-height:1.45}
          .story-page .chapter-two-story-thesis{margin:2rem 0;padding:1.25rem 1.5rem;border-left:3px solid #a97b68;background:rgba(255,255,255,.5)}
          .story-page .chapter-two-story-thesis strong{font-size:1.25em}
          @media(max-width:640px){.story-page .chapter-two-story-heading{padding:1.5rem 1.1rem .7rem}.story-page .chapter-two-story-preview{padding:.8rem 1.1rem 2rem}}
          '''
          styles_path.write_text(styles, encoding="utf-8")

          assert "花有重開日" in index and "安樂是天倫" in index
          assert "chosen-life-v4" in index
          assert "孩子被選擇的人生" in story
          assert "下一章從一個在程序中被反覆提起的說法開始" not in story
          PY

      - name: Validate synchronized output
        shell: bash
        run: |
          git diff --check
          grep -q 'cinematic-revamp.js?v=20260823-ch2-5' index.html
          grep -q 'id="chapter-two-preview"' story.html
          grep -q '孩子被選擇的人生' story.html

      - name: Commit synchronized publication
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No synchronization changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html story.html assets/css/styles.css
          git commit -m "fix: synchronize chosen-life Chapter Two preview [chapter-two-sync]"
          git push
