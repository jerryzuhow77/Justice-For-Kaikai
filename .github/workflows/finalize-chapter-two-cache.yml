name: Finalize Chapter Two Cache Versions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-chapter-two-cache.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify final asset versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('cinematic-revamp.css?v=20260823-ch2-5', 'cinematic-revamp.css?v=20260823-ch2-6')
          index = index.replace('cinematic-revamp.js?v=20260823-ch2-5', 'cinematic-revamp.js?v=20260823-ch2-6')
          index_path.write_text(index, encoding='utf-8')

          story_path = Path('story.html')
          story = story_path.read_text(encoding='utf-8')
          story = story.replace('assets/css/styles.css?v=20260822-2', 'assets/css/styles.css?v=20260823-ch2-6')
          story_path.write_text(story, encoding='utf-8')

          assert 'cinematic-revamp.js?v=20260823-ch2-6' in index
          assert 'cinematic-revamp.css?v=20260823-ch2-6' in index
          assert 'assets/css/styles.css?v=20260823-ch2-6' in story
          PY
          git diff --check
      - name: Commit final cache versions
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html story.html
          git commit -m "fix: finalize Chapter Two cache versions [chapter-two-cache]"
          git push
