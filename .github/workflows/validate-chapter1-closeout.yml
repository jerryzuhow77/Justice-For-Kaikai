name: Validate Chapter 1 closeout

on:
  push:
    branches: [main]
    paths:
      - index.html
      - README.md
      - assets/css/cinematic-revamp.css
      - assets/css/chapter1-design-polish.css
      - assets/css/chapter1-closeout.css
      - assets/js/cinematic-revamp.js
      - assets/js/chapter1-design-polish.js
      - assets/data/scenes.js
      - assets/data/film-productions.js
      - docs/V8.0-animation-closeout.md
      - docs/films/**
      - .github/workflows/validate-chapter1-closeout.yml
  pull_request:
    paths:
      - index.html
      - README.md
      - assets/css/cinematic-revamp.css
      - assets/css/chapter1-design-polish.css
      - assets/css/chapter1-closeout.css
      - assets/js/cinematic-revamp.js
      - assets/js/chapter1-design-polish.js
      - assets/data/scenes.js
      - assets/data/film-productions.js
      - docs/V8.0-animation-closeout.md
      - docs/films/**

permissions:
  contents: read

jobs:
  closeout-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check assets/js/cinematic-revamp.js
          node --check assets/js/chapter1-design-polish.js
          node --check assets/data/scenes.js
          node --check assets/data/film-productions.js

      - name: Chapter 1 static QA
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path('.')
          html = (root/'index.html').read_text(encoding='utf-8')
          readme = (root/'README.md').read_text(encoding='utf-8')
          css_wrapper = (root/'assets/css/cinematic-revamp.css').read_text(encoding='utf-8')
          design_css = (root/'assets/css/chapter1-design-polish.css').read_text(encoding='utf-8')
          closeout_css = (root/'assets/css/chapter1-closeout.css').read_text(encoding='utf-8')
          wrapper_js = (root/'assets/js/cinematic-revamp.js').read_text(encoding='utf-8')
          design_js = (root/'assets/js/chapter1-design-polish.js').read_text(encoding='utf-8')
          films_js = (root/'assets/data/film-productions.js').read_text(encoding='utf-8')
          v8 = (root/'docs/V8.0-animation-closeout.md').read_text(encoding='utf-8')

          required_html = [
              '花有重開日，','人無再少年。','應須惜兒孫，','安樂是天倫。',
              'id="film-reel"','id="full-copy"','id="scene-library"','id="chapter-two-preview"',
              'id="cinema-dialog"','id="transcript"','id="toggle-transcript"','id="ambient-audio"',
              '20260824-web-closeout-1'
          ]
          missing = [item for item in required_html if item not in html]
          if missing:
              raise SystemExit(f'Missing closeout markers: {missing}')

          for filename, text in [
              ('chapter1-design-polish.css', design_css),
              ('chapter1-closeout.css', closeout_css),
          ]:
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {filename}')

          if 'chapter1-closeout.css?v=20260824-web-closeout-1' not in css_wrapper:
              raise SystemExit('Closeout CSS is not loaded by cinematic-revamp.css')
          if 'prefers-reduced-motion: reduce' not in design_js or 'kk-reduced-v8' not in design_js:
              raise SystemExit('Design polish does not fully honor reduced motion')
          if 'brightness(.92)' not in closeout_css:
              raise SystemExit('Film-card brightness closeout override missing')

          if 'chapter1-copy-polish' in wrapper_js:
              raise SystemExit('Temporary dialogue rewrite layer is still loaded')
          if (root/'assets/data/chapter1-copy-polish.js').exists():
              raise SystemExit('Temporary dialogue rewrite file still exists')

          titles = [
              '土掩埋不住的清朝民間傳說',
              '無法再相見▪︎天涯各自分',
              '青絲變白髮',
              '兩個朝代▪︎不同世界▪︎同一扇門',
          ]
          for title in titles:
              if title not in films_js:
                  raise SystemExit(f'Runtime film title missing: {title}')
              if title not in v8:
                  raise SystemExit(f'V8 film title missing: {title}')
              if title not in readme:
                  raise SystemExit(f'README film title missing: {title}')

          film_docs = [
              'docs/films/FM-A-土掩埋不住的清朝民間傳說.md',
              'docs/films/FM-D-無法再相見-天涯各自分.md',
              'docs/films/FM-B-青絲變白髮.md',
              'docs/films/FM-C-兩個朝代-不同世界-同一扇門.md',
          ]
          for path in film_docs:
              if not (root/path).is_file():
                  raise SystemExit(f'Missing film production sheet: {path}')

          class Parser(HTMLParser):
              pass
          Parser().feed(html)
          print('Chapter 1 web + animation closeout static QA passed')
          PY
